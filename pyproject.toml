[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "dvf"
dynamic = ["version"]
description = "Configuration-driven data and schema validation for data migrations and data engineering."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "dvf contributors" }]
keywords = [
  "data-validation",
  "data-quality",
  "data-migration",
  "reconciliation",
  "schema-validation",
  "data-engineering",
  "etl-testing",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "packaging>=24.0",
  "pluggy>=1.5",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0.1",
  "rich>=13.7",
  "sqlglot>=30.0,<31",
  "typer>=0.12",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

# Connector, engine, and format extras are added as their implementations land (Phase 1 onward).
[project.optional-dependencies]

[project.scripts]
dvf = "dvf.cli.app:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "jsonschema>=4.22",
  "mypy>=1.11",
  "nox>=2024.4.15",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/dvf"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "schemas",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PTH",  # use pathlib
  "RUF",  # ruff-specific
  "S",    # bandit (security)
  "SIM",  # simplify
  "T20",  # no print statements
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
# The formatter enforces line length for code; long strings and docstrings are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"noxfile.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["dvf"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["dvf"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: needs external services such as databases (run with -m integration)",
  "slow: long-running tests",
]

[tool.coverage.run]
source = ["dvf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]
