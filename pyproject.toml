[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "dvf-framework"
dynamic = ["version"]
description = "Configuration-driven data and schema validation for data migrations and data engineering."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "dvf contributors" }]
keywords = [
  "data-validation",
  "data-quality",
  "data-migration",
  "reconciliation",
  "schema-validation",
  "data-engineering",
  "etl-testing",
  "data-reconciliation",
  "data-testing",
  "data-contracts",
  "duckdb",
  "spark",
  "sap",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "duckdb>=1.4,<2",
  "jinja2>=3.1",
  "packaging>=24.0",
  "pluggy>=1.5",
  "pyarrow>=18",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0.1",
  "rich>=13.7",
  "sqlglot>=30.0,<31",
  "typer>=0.12",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

# Optional engines and connectors. Proprietary drivers are never bundled.
[project.optional-dependencies]
polars = [
    "polars>=1.20,<2",
]
postgres = [
    "psycopg[binary]>=3.2",
]
mysql = [
    "pymysql>=1.1",
]
mssql = [
    "mssql-python>=0.13",
]
oracle = [
    "oracledb>=2.4",
]
snowflake = [
    "snowflake-connector-python>=3.12",
]
bigquery = [
    "google-cloud-bigquery>=3.25",
]
redshift = [
    "redshift-connector>=2.1",
]
databricks = [
    "databricks-sql-connector>=4.0",
]
excel = [
    "openpyxl>=3.1",
]
spark = [
    "pandas>=2.2",
    "pyspark>=4.0",
]
pandas = [
    "pandas>=2.2",
]
delta = [
    "deltalake>=1.0",
]
iceberg = [
    "pyiceberg>=0.9",
]
avro = [
    "fastavro>=1.9",
]
mongodb = [
    "pymongo>=4.8",
]
cassandra = [
    "cassandra-driver>=3.29",
]
dynamodb = [
    "boto3>=1.34",
]
cosmos = [
    "azure-cosmos>=4.7",
    "azure-identity>=1.17",
]
# Open-source drivers only. Databricks Connect replaces pyspark, so it is installed separately.
all = [
    "dvf-framework[polars,pandas,postgres,mysql,mssql,oracle,snowflake,bigquery,redshift,databricks,excel,spark,delta,iceberg,avro,mongodb,cassandra,dynamodb,cosmos,sqlalchemy,odbc,otel,azure,aws,gcp,keyring]",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
azure = [
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
]
aws = [
    "boto3>=1.34",
]
gcp = [
    "google-cloud-secret-manager>=2.20",
]
keyring = [
    "keyring>=25",
]
sqlalchemy = [
    "sqlalchemy>=2.0",
]
odbc = [
    "pyodbc>=5.1",
]

[project.urls]
# Replace OWNER/REPOSITORY once the GitHub repository exists (see docs/releasing.md).
Homepage = "https://github.com/OWNER/REPOSITORY"
Repository = "https://github.com/OWNER/REPOSITORY"
Documentation = "https://OWNER.github.io/REPOSITORY/"
Issues = "https://github.com/OWNER/REPOSITORY/issues"
Changelog = "https://github.com/OWNER/REPOSITORY/blob/main/CHANGELOG.md"
Releases = "https://github.com/OWNER/REPOSITORY/releases"

[project.scripts]
dvf = "dvf.cli.app:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "jsonschema>=4.22",
  "mssql-python>=0.13",
  "mypy>=1.11",
  "nox>=2024.4.15",
  "boto3>=1.34",
  "deltalake>=1.0",
  "fastavro>=1.9",
  "openpyxl>=3.1",
  "oracledb>=2.4",
  "pandas>=2.2",
  "polars>=1.20,<2",
  "pre-commit>=3.7",
  "psycopg[binary]>=3.2",
  "pyiceberg>=0.9",
  "pymongo>=4.8",
  "pymysql>=1.1",
  "pyspark>=4.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "testcontainers[postgres,mongodb]>=4.8",
  "types-PyYAML>=6.0",
  "opentelemetry-sdk>=1.27",
  "keyring>=25",
  "sqlalchemy>=2.0",
  "pyodbc>=5.1",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/dvf"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "schemas",
  "examples",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "PTH",  # use pathlib
  "RUF",  # ruff-specific
  "S",    # bandit (security)
  "SIM",  # simplify
  "T20",  # no print statements
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]
# The formatter enforces line length for code; long strings and docstrings are allowed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S608"]
# Pushdown SQL is generated on purpose: identifiers are quoted and literals escaped by
# dvf.sql.dialects, and user SQL fragments are trusted configuration (BUILD_PROMPT.md 13).
# assert is used only to narrow types for mypy on internal invariants, never to validate input.
"src/dvf/**" = ["S101", "S608"]
"noxfile.py" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["dvf"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["dvf"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "integration: needs external services such as databases (run with -m integration)",
  "slow: long-running tests",
  "spark: needs a local Spark session (Java 17 or later and pyspark)",
]

[tool.coverage.run]
source = ["dvf"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]
