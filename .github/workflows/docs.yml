name: Docs

# Builds the MkDocs site and deploys it to GitHub Pages. The release workflow calls this for
# every final release, with the release tag, so the site always matches the latest release.
# Run it manually to republish (for example after fixing a typo on main).

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a release tag)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build, for example v1.0.0 (empty for the selected branch)
        required: false
        type: string

permissions: {}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --group docs
      - name: Build in strict mode (broken links and missing pages fail the build)
        run: uv run mkdocs build --strict --site-dir site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # the Pages deployment verifies the workflow's OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a running deployment is never cancelled halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
