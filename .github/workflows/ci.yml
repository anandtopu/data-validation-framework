name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Java for the local Spark tests (Spark 4 needs Java 17 or 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Validate the example configurations through the CLI
        run: |
          uv run dvf validate-config examples/local_files/dvf.yaml
          uv run dvf validate-config examples/sap_to_snowflake/dvf.yaml --profile uat
          uv run dvf validate-config examples/mongodb_to_postgres/dvf.yaml
          uv run dvf validate-config examples/migration/dvf.yaml
          uv run dvf validate-config examples/ci/dvf.yaml
      - name: Run the seeded example end to end (exit code 1 = defects found, as intended)
        shell: bash
        run: |
          uv run dvf init "$RUNNER_TEMP/demo" --example
          set +e
          uv run dvf run "$RUNNER_TEMP/demo/dvf.yaml" -o "$RUNNER_TEMP/demo/out"
          code=$?
          set -e
          test "$code" -eq 1
          test -f "$RUNNER_TEMP/demo/out/report.html"
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration (PostgreSQL, MySQL, SQL Server, Oracle, MongoDB)
    runs-on: ubuntu-latest
    # Throwaway service containers; the passwords below exist only inside this job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dvf-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dvf-ci
          MYSQL_DATABASE: dvf
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdvf-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Dvf-ci-Passw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dvf-ci-Passw0rd -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: dvf-ci
          APP_USER: dvf_test
          APP_USER_PASSWORD: dvf-ci
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DVF_TEST_POSTGRES_URL: postgresql://postgres:dvf-ci@localhost:5432/postgres
      DVF_TEST_MYSQL_URL: mysql://root:dvf-ci@localhost:3306/dvf
      DVF_TEST_MSSQL_URL: mssql://sa:Dvf-ci-Passw0rd@127.0.0.1:1433/master?TrustServerCertificate=yes
      DVF_TEST_ORACLE_URL: oracle://dvf_test:dvf-ci@localhost:1521/FREEPDB1
      DVF_TEST_MONGODB_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # The dev group includes the open-source drivers (PostgreSQL, MySQL, SQL Server, Oracle,
      # MongoDB) and pyspark.
      - run: uv sync --locked
      - run: uv run pytest -m integration -v

  benchmark:
    name: Benchmarks (2 million rows)
    # On main and on demand; on pull requests only when labelled 'benchmark'.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    env:
      DVF_BENCH_ROWS: "2000000"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Restore the baseline of this runner type
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks/baseline.json
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-${{ runner.os }}-
      - name: Run benchmarks (fail on a miss or a >15% slowdown)
        run: uv run nox -s benchmark -- ${{ github.ref == 'refs/heads/main' && '--update' || '' }}
      - name: Save the new baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .benchmarks/baseline.json
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-results
          path: .benchmarks/results.json

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked --group docs
      - name: Generated reference pages are up to date
        run: uv run nox -s docs_reference -- --check
      - run: uv run mkdocs build --strict

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/wheel-test
          uv pip install --python /tmp/wheel-test dist/*.whl
          /tmp/wheel-test/bin/dvf --version
          /tmp/wheel-test/bin/dvf validate-config examples/local_files/dvf.yaml
          /tmp/wheel-test/bin/dvf init /tmp/demo --example
          set +e; /tmp/wheel-test/bin/dvf run /tmp/demo/dvf.yaml --no-reports; code=$?; set -e
          test "$code" -eq 1

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # Exports uv.lock (runtime with every extra, then every group) to hashed requirements
      # and audits them against the PyPI and OSV advisory databases, without installing.
      - run: uvx nox@2026.10.20 -s audit

  docker:
    name: Container image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the image version comes from git
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      # Builds docker/Dockerfile.<variant> for linux/amd64, then checks dvf --version and runs
      # the seeded example in a mounted folder (exit code 1 and a report.html expected).
      - run: uvx nox@2026.10.20 -s docker -- ${{ matrix.variant }}
