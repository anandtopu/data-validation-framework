name: Scorecard

# OpenSSF Scorecard supply-chain checks. Results go to the code scanning dashboard and to the
# public Scorecard API, which serves the README badge. The Scorecard API only accepts results
# from workflows that follow its rules: no top-level env or defaults, no write permissions at
# the top level, and only approved actions in this job.

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check current.
  schedule:
    - cron: "27 4 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Results can only be published from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish results to the Scorecard API for the badge
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
